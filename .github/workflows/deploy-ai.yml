name: Deploy AI Server

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-ai
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/team6-six-sashimi/ai-sashimi-six

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import smoke check
        run: python -c "from app.main import app; app.openapi()"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GH Actions 러너에서 빌드 (EC2는 더 이상 빌드 안 함 - 디스크/CPU 부담 제거)
      # cache-from/to type=gha: 러너의 빌드 캐시를 GitHub Actions 캐시에 저장,
      # requirements.txt/모델이 안 바뀌면 다음 빌드부터 재사용됨
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    env:
      AI_EC2_HOST: ${{ secrets.AI_EC2_HOST }}
      AI_EC2_USER: ${{ secrets.AI_EC2_USER }}
      EC2_ENV_FILE: /home/ubuntu/ai-sashimi.env
      DOCKER_CONTAINER: ai-sashimi
      APP_PORT: 8001

    steps:
      - name: Configure SSH key
        env:
          AI_EC2_SSH_KEY: ${{ secrets.AI_EC2_SSH_KEY }}
        run: |
          test -n "$AI_EC2_HOST"
          test -n "$AI_EC2_USER"
          test -n "$AI_EC2_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$AI_EC2_SSH_KEY" > ~/.ssh/ai-sashimi-ec2.pem
          chmod 600 ~/.ssh/ai-sashimi-ec2.pem
          ssh-keyscan -H "$AI_EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy application
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/ai-sashimi-ec2.pem \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=10 \
            -o TCPKeepAlive=yes \
            "$AI_EC2_USER@$AI_EC2_HOST" \
            "ENV_FILE='$EC2_ENV_FILE' DOCKER_CONTAINER='$DOCKER_CONTAINER' APP_PORT='$APP_PORT' IMAGE_REF='$IMAGE_REF' GHCR_TOKEN='$GHCR_TOKEN' GHCR_USER='$GHCR_USER' bash -s" <<'REMOTE'
          set -euo pipefail

          if [ ! -f "$ENV_FILE" ]; then
            echo "Missing env file: $ENV_FILE" >&2
            exit 1
          fi

          if grep -q 'CHANGE_ME' "$ENV_FILE"; then
            echo "Unfilled CHANGE_ME value exists in $ENV_FILE" >&2
            exit 1
          fi

          echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin
          sudo docker pull "$IMAGE_REF"

          sudo docker rm -f "$DOCKER_CONTAINER" >/dev/null 2>&1 || true
          sudo docker run -d \
            --name "$DOCKER_CONTAINER" \
            --restart unless-stopped \
            --env-file "$ENV_FILE" \
            --memory="600m" \
            --memory-swap="800m" \
            -p "$APP_PORT:$APP_PORT" \
            -e "PORT=$APP_PORT" \
            "$IMAGE_REF"

          for attempt in $(seq 1 30); do
            if sudo docker exec "$DOCKER_CONTAINER" python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:$APP_PORT/health', timeout=3).status == 200 else 1)"; then
              echo "AI server health check passed."

              # 로컬 빌드가 없어졌으니 builder cache는 정리할 게 없음.
              # pull로 받은 이미지 중 현재 컨테이너가 안 쓰는 것만 정리 (latest/방금 받은 태그는 유지됨).
              sudo docker image prune -f

              exit 0
            fi
            sleep 5
          done

          echo "AI server health check failed." >&2
          sudo docker logs --tail 200 "$DOCKER_CONTAINER" >&2
          exit 1
          REMOTE

      - name: Create Grafana deploy annotation
        if: success()
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_API_TOKEN: ${{ secrets.GRAFANA_API_TOKEN }}
        run: |
          if [ -z "${GRAFANA_URL:-}" ] || [ -z "${GRAFANA_API_TOKEN:-}" ]; then
            echo "GRAFANA_URL/GRAFANA_API_TOKEN secret이 없어 annotation 등록을 건너뜁니다."
            exit 0
          fi
          curl -sf -X POST "$GRAFANA_URL/api/annotations" \
            -H "Authorization: Bearer $GRAFANA_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(printf '{"text": "AI서버 배포: %s (%s)", "tags": ["deploy", "ai-sashimi"]}' "${GITHUB_SHA:0:7}" "$GITHUB_ACTOR")" \
            || echo "Grafana annotation 등록 실패 (배포 자체는 정상 완료됨)"
