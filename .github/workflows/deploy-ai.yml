name: Deploy AI Server

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-ai
  cancel-in-progress: false

jobs:
  build-check:
    name: Build check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import smoke check
        run: python -c "from app.main import app; app.openapi()"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-check

    env:
      AI_EC2_HOST: ${{ secrets.AI_EC2_HOST }}
      AI_EC2_USER: ${{ secrets.AI_EC2_USER }}
      EC2_APP_DIR: /home/ubuntu/-AI-Sashimi-Six
      EC2_ENV_FILE: /home/ubuntu/ai-sashimi.env
      DOCKER_IMAGE_REPO: ai-sashimi-six
      DOCKER_CONTAINER: ai-sashimi
      APP_PORT: 8001
      DEPLOY_BRANCH: ${{ github.ref_name }}
      IMAGE_KEEP_COUNT: 5

    steps:
      - name: Configure SSH key
        env:
          AI_EC2_SSH_KEY: ${{ secrets.AI_EC2_SSH_KEY }}
        run: |
          test -n "$AI_EC2_HOST"
          test -n "$AI_EC2_USER"
          test -n "$AI_EC2_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$AI_EC2_SSH_KEY" > ~/.ssh/ai-sashimi-ec2.pem
          chmod 600 ~/.ssh/ai-sashimi-ec2.pem
          ssh-keyscan -H "$AI_EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy application
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA=$(echo "$IMAGE_SHA" | cut -c1-7)
          ssh -i ~/.ssh/ai-sashimi-ec2.pem "$AI_EC2_USER@$AI_EC2_HOST" \
            "APP_DIR='$EC2_APP_DIR' ENV_FILE='$EC2_ENV_FILE' DOCKER_IMAGE_REPO='$DOCKER_IMAGE_REPO' IMAGE_TAG='$SHORT_SHA' DOCKER_CONTAINER='$DOCKER_CONTAINER' APP_PORT='$APP_PORT' DEPLOY_BRANCH='$DEPLOY_BRANCH' IMAGE_KEEP_COUNT='$IMAGE_KEEP_COUNT' bash -s" <<'REMOTE'
          set -euo pipefail

          if [ ! -f "$ENV_FILE" ]; then
            echo "Missing env file: $ENV_FILE" >&2
            exit 1
          fi

          if grep -q 'CHANGE_ME' "$ENV_FILE"; then
            echo "Unfilled CHANGE_ME value exists in $ENV_FILE" >&2
            exit 1
          fi

          cd "$APP_DIR"
          git fetch origin "$DEPLOY_BRANCH"
          git checkout -B "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"

          IMAGE_LATEST="$DOCKER_IMAGE_REPO:latest"
          IMAGE_VERSIONED="$DOCKER_IMAGE_REPO:$IMAGE_TAG"

          # latest + 커밋 SHA 태그를 같이 붙여서 빌드 (롤백용 버전 보존)
          sudo docker build -t "$IMAGE_LATEST" -t "$IMAGE_VERSIONED" .
          sudo docker rm -f "$DOCKER_CONTAINER" >/dev/null 2>&1 || true
          sudo docker run -d \
            --name "$DOCKER_CONTAINER" \
            --restart unless-stopped \
            --env-file "$ENV_FILE" \
            -p "$APP_PORT:$APP_PORT" \
            -e "PORT=$APP_PORT" \
            "$IMAGE_LATEST"

          for attempt in $(seq 1 30); do
            if sudo docker exec "$DOCKER_CONTAINER" python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:$APP_PORT/health', timeout=3).status == 200 else 1)"; then
              echo "AI server health check passed. Image tag: $IMAGE_TAG"

              sudo docker builder prune -f

              # 버전 태그된 이미지는 dangling이 아니라서 prune으로 안 지워짐.
              # 최근 N개(IMAGE_KEEP_COUNT)만 남기고 오래된 버전 태그 정리 (latest는 항상 보존).
              sudo docker images "$DOCKER_IMAGE_REPO" --format '{{.CreatedAt}}\t{{.Tag}}' \
                | awk -F'\t' '$2 != "latest"' \
                | sort -r \
                | tail -n +$((IMAGE_KEEP_COUNT + 1)) \
                | awk -F'\t' '{print $2}' \
                | while read -r old_tag; do
                    if [ -n "$old_tag" ]; then
                      echo "오래된 이미지 태그 정리: $DOCKER_IMAGE_REPO:$old_tag"
                      sudo docker rmi "$DOCKER_IMAGE_REPO:$old_tag" >/dev/null 2>&1 || true
                    fi
                  done

              exit 0
            fi
            sleep 5
          done

          echo "AI server health check failed." >&2
          sudo docker logs --tail 200 "$DOCKER_CONTAINER" >&2
          exit 1
          REMOTE

      - name: Create Grafana deploy annotation
        if: success()
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_API_TOKEN: ${{ secrets.GRAFANA_API_TOKEN }}
        run: |
          if [ -z "${GRAFANA_URL:-}" ] || [ -z "${GRAFANA_API_TOKEN:-}" ]; then
            echo "GRAFANA_URL/GRAFANA_API_TOKEN secret이 없어 annotation 등록을 건너뜁니다."
            exit 0
          fi
          curl -sf -X POST "$GRAFANA_URL/api/annotations" \
            -H "Authorization: Bearer $GRAFANA_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(printf '{"text": "AI서버 배포: %s (%s)", "tags": ["deploy", "ai-sashimi"]}' "${GITHUB_SHA:0:7}" "$GITHUB_ACTOR")" \
            || echo "Grafana annotation 등록 실패 (배포 자체는 정상 완료됨)"
